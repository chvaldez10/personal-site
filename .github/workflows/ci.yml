name: App checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chvaldez10
    env:
      SITE_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: chvaldez10/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: chvaldez10/package.json
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:dev
      - run: pnpm run doctor
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: chvaldez10/test-results/
          retention-days: 7
